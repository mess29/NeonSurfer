<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Phaser Neon Surfer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Phaser 3 Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <!-- Yandex Games SDK -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <script type="text/javascript">
        window.ysdkInitPromise = null;
        if (typeof YaGames !== 'undefined') {
            window.ysdkInitPromise = YaGames.init().then(ysdk => {
                window.ysdk = ysdk;
                if (window.ysdk.features.LoadingAPI) {
                    window.ysdk.features.LoadingAPI.ready(); // Oyunun yüklendiğini Yandex'e bildirir
                }
            }).catch(console.error);
        }
        
        // Yandex Event Helpers
        window.yandexPauseGame = function() {
            if (window.AudioSys && window.AudioSys.ctx) window.AudioSys.ctx.suspend();
            if (window.game && window.game.scene) {
                // Sahnelerin fiziğini ve update döngüsünü durdur, ama UI menülerini açma
                let scene = window.game.scene.scenes[0];
                if(scene && scene.physics) scene.physics.pause();
                if(scene && scene.time) scene.time.paused = true;
            }
        };
        
        window.yandexResumeGame = function() {
            if (window.AudioSys && window.AudioSys.ctx) window.AudioSys.ctx.resume();
            
            if (window.game && window.game.scene) {
                let scene = window.game.scene.scenes[0];
                // Yalnızca kullanıcı kendi menüden durdurmamışsa devam ettir
                if(window.GameState && window.GameState.isPlaying && !window.GameState.isPaused) {
                    if(scene && scene.physics) scene.physics.resume();
                    if(scene && scene.time) scene.time.paused = false;
                }
            }
        };
    </script>
</head>

<body>

    <div id="damage-flash"></div>

    <div id="ui-layer">
        <div class="hud hidden" id="game-hud">
            <div>
                <div class="score">SCORE: <span id="score-val">0</span></div>
                <div class="high-score">HIGH: <span id="hi-score-val">0</span></div>
                <div id="powerup-status"></div>
            </div>

            <!-- YENİ: Boss UI Ekranı Merkezde -->
            <div id="boss-ui" class="hidden"
                style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 300px; text-align: center; color: #ff0055;">
                <div
                    style="font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0000; letter-spacing: 2px;">
                    SECTOR GUARDIAN (BOSS)</div>
                <div class="health-bar-container"
                    style="width: 100%; border-color: #ff0055; background: rgba(255,0,0,0.1);">
                    <div id="boss-health-bar"
                        style="background: linear-gradient(90deg, #aa0000, #ff0055); width: 100%; height: 100%; transition: width 0.2s;">
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start;">
                <div>
                    <div style="font-size: 12px; text-align: right; color: #ccc;">HULL INTEGRITY</div>
                    <div class="health-bar-container">
                        <div id="health-bar"></div>
                    </div>
                </div>
                <button id="pause-btn" onclick="togglePause()">II</button>
            </div>
        </div>

        <div id="start-screen" class="menu-screen">
            <h1>Space Surfer<br><span style="font-size: 20px; color:#aaa;">DEEP SPACE MISSION</span></h1>
            <p style="text-align:center; color:#ccc; max-width: 300px; font-size: 12px; line-height: 1.6;">
                <b>Move:</b> Mouse/Touch or Arrow Keys/WASD<br>
                <b>Fire:</b> Click or SPACE key<br>
                ⭐ Score | 🪨 Damage | 🛡️ Shield | 🧲 Magnet
            </p>
            <button class="btn" onclick="startGame()">Ignite Engines</button>
        </div>

        <div id="game-over-screen" class="menu-screen hidden">
            <h1
                style="background: -webkit-linear-gradient(45deg, #ff0055, #ff5500); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                SHIP DESTROYED</h1>
            <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Score: <span
                    id="final-score-val">0</span></div>
            <button class="btn" onclick="startGame()">Restart</button>
        </div>

        <!-- Yeni: Pause (Durdurma) Ekranı -->
        <div id="pause-screen" class="menu-screen hidden" style="background: rgba(5, 5, 16, 0.7);">
            <h1>SYSTEM PAUSED</h1>
            <button class="btn" onclick="togglePause()">Return to Battle</button>
        </div>

        <!-- Yeni: Tehlike (Warning) Ekranı Overlay -->
        <div id="warning-overlay" class="hidden"
            style="position: absolute; top:0; left:0; width:100%; height:100%; display: flex; align-items: center; justify-content: center; background: rgba(255,0,0,0.15); pointer-events: none; z-index: 15; backdrop-filter: blur(2px);">
            <div class="warning-text">⚠️ WARNING ⚠️<br><span style="font-size: 20px;">SECTOR GUARDIAN APPROACHING</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
